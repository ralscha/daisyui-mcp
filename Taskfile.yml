version: '3'

vars:
  SERVER_BIN: bin/daisyui-server{{exeExt}}
  UPDATE_BIN: bin/daisyui-update{{exeExt}}

tasks:
  default:
    desc: List all available tasks
    silent: true
    cmds:
      - task --list

  format:
    desc: Format all Go source files
    cmds:
      - go fix ./...
      - go fmt ./...

  build:
    desc: Build all binaries into bin/
    deps: [build:server, build:update]

  build:server:
    desc: Build the MCP server binary
    cmds:
      - go build -ldflags="-s -w" -trimpath -o {{.SERVER_BIN}} ./cmd/server
    sources:
      - '**/*.go'
      - go.mod
      - go.sum
      - 'docs/**/*.md'
      - 'components/**/*.md'
      - 'guide/**/*.md'
    generates:
      - '{{.SERVER_BIN}}'

  build:update:
    desc: Build the component updater binary
    cmds:
      - go build -o {{.UPDATE_BIN}} ./cmd/update
    sources:
      - cmd/update/*.go
      - go.mod
      - go.sum
    generates:
      - '{{.UPDATE_BIN}}'

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  lint:
    desc: Run golangci-lint in a Docker container
    cmds:
      - docker run --rm -v {{toSlash .ROOT_DIR}}:/app -w /app golangci/golangci-lint:v2.12.2 golangci-lint run -v --timeout 5m

  update:
    desc: Fetch latest DaisyUI docs and rebuild MCP server
    dir: '{{.ROOT_DIR}}'
    cmds:
      - go run ./cmd/update
      - task: build
      
  release:
    cmds:
      - git tag -a v1.0.0 -m "Initial release"
      - git push origin v1.0.0
      - goreleaser release      