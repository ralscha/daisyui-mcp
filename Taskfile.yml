version: '3'

vars:
  SERVER_BIN: bin/daisyui-server{{exeExt}}
  UPDATE_BIN: bin/daisyui-update{{exeExt}}

tasks:
  default:
    desc: List all available tasks
    silent: true
    cmds:
      - task --list

  format:
    desc: Format all Go source files
    cmds:
      - go fix ./...
      - go fmt ./...

  build:
    desc: Build all binaries into bin/
    deps: [build:server, build:update]

  build:server:
    desc: Build the MCP server binary
    deps: [update:docs]
    cmds:
      - go build -ldflags="-s -w" -trimpath -o {{.SERVER_BIN}} ./cmd/server
    sources:
      - '**/*.go'
      - go.mod
      - go.sum
      - 'docs/**/*.md'
      - 'components/**/*.md'
      - 'guide/**/*.md'
      - 'recipes/**/*.md'
    generates:
      - '{{.SERVER_BIN}}'

  build:update:
    desc: Build the component updater binary
    cmds:
      - go build -o {{.UPDATE_BIN}} ./cmd/update
    sources:
      - cmd/update/*.go
      - go.mod
      - go.sum
    generates:
      - '{{.UPDATE_BIN}}'

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  lint:
    desc: Run golangci-lint in a Docker container
    cmds:
      - docker run --rm -v {{toSlash .ROOT_DIR}}:/app -w /app golangci/golangci-lint:v2.13.2 golangci-lint run -v --timeout 5m

  update:docs:
    desc: Fetch latest DaisyUI docs
    dir: '{{.ROOT_DIR}}'
    cmds:
      - go run ./cmd/update

  update:
    desc: Fetch latest DaisyUI docs and rebuild MCP server
    dir: '{{.ROOT_DIR}}'
    cmds:
      - task: build

  tag:
    desc: Create a local git tag for a release
    summary: |
      Create a local git tag.

      Run with `task --interactive tag` to be prompted for TAG,
      or pass it explicitly with `task tag TAG=v1.0.0`.
    requires:
      vars: [TAG]
    preconditions:
      - sh: 'case "{{.TAG}}" in v*) exit 0 ;; *) exit 1 ;; esac'
        msg: TAG must start with v, for example v1.0.0
      - sh: 'if git rev-parse -q --verify "refs/tags/{{.TAG}}" >/dev/null 2>&1; then exit 1; fi; exit 0'
        msg: Tag already exists locally
    cmds:
      - git tag {{.TAG}}

  push-tag:
    desc: Push an existing git tag to GitHub
    requires:
      vars: [TAG]
    preconditions:
      - sh: 'case "{{.TAG}}" in v*) exit 0 ;; *) exit 1 ;; esac'
        msg: TAG must start with v, for example v1.0.0
      - sh: 'if git rev-parse -q --verify "refs/tags/{{.TAG}}" >/dev/null 2>&1; then exit 0; else exit 1; fi'
        msg: Tag does not exist locally. Run `task tag TAG=v1.0.0` first.
    cmds:
      - git push origin {{.TAG}}

  release-tag:
    desc: Create and push a release tag to GitHub
    requires:
      vars: [TAG]
    preconditions:
      - sh: 'case "{{.TAG}}" in v*) exit 0 ;; *) exit 1 ;; esac'
        msg: TAG must start with v, for example v1.0.0
      - sh: 'if git rev-parse -q --verify "refs/tags/{{.TAG}}" >/dev/null 2>&1; then exit 1; fi; exit 0'
        msg: Tag already exists locally
    cmds:
      - git tag {{.TAG}}
      - git push origin {{.TAG}}
