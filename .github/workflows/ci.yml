name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            test-flags: -race
          - os: windows-latest
            test-flags: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Fetch pinned daisyUI documentation
        run: go run ./cmd/update

      - name: Verify dependencies
        run: go mod verify

      - name: Check module files
        run: go mod tidy -diff

      - name: Run tests
        run: go test ${{ matrix.test-flags }} ./...

      - name: Run static checks
        run: go vet ./...

      - name: Build
        run: go build ./...
